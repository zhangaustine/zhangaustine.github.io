                <section>

                    <button class="flt type" onclick="filterSelection('internship')">internship</button>

                    <button class="flt type" onclick="filterSelection('remote')">remote</button>
                    <button class="flt type" onclick="filterSelection('hybrid')">hybrid</button>
                    <button class="flt type" onclick="filterSelection('miscs')">miscs</button>

                    <button class="fltitm full-time part-time in-person arts learns publics">circulation desk @ orwig music library</button>

                    <button class="fltitm part-time in-person hybrid physics maths codes learns creates researches arts teaches">physics utra awardee @ brown</button>
